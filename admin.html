<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Poshak Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#e85d8a">
<style>
:root{
  --pink:#ff8fab; --pink-dark:#e85d8a; --cream:#fff8f2; --card:#ffffff;
  --text:#3a2e2e; --muted:#8a7b7b; --border:#f0dfe3; --accent:#7fd8be;
  --bg:var(--cream); --shadow:0 4px 14px rgba(232,93,138,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#221a1d; --card:#2e2427; --text:#f5e9ea; --muted:#b39a9a; --border:#4a3a3d; }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;padding:10px max(16px,calc((100vw - 1680px)/2 + 24px));display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);flex-wrap:wrap;gap:10px;}
header h1{margin:0;font-size:20px;cursor:pointer;white-space:nowrap;}
.navicons{display:flex;gap:18px;align-items:center;}
.navicon{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;color:#fff;position:relative;}
.navicon span.ic{font-size:18px;}
.navbadge{position:absolute;top:-6px;right:-10px;background:#fff;color:var(--pink-dark);border-radius:10px;font-size:10px;font-weight:800;padding:1px 5px;}
.navbadge.urgent{background:#ff3b30;color:#fff;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
.newordermodal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
.newordercard{background:var(--card);border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3);}
main{max-width:1680px;margin:0 auto;padding:16px 24px 90px;}
.hidden{display:none !important;}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--border);}
.emoji{font-size:40px;text-align:center;margin-bottom:6px;}
.pstock{font-size:12px;color:var(--muted);}
.pstock.low{color:#d9534f;font-weight:600;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
.overlay.center{align-items:center;padding:16px;}
.overlay.center .sheet{border-radius:16px;max-height:85vh;}
.sheet{background:var(--card);width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;position:relative;}
.cartrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin:6px 0 12px;background:var(--card);color:var(--text);font-size:14px;}
label{font-size:13px;color:var(--muted);}
.total{font-size:18px;font-weight:700;margin:10px 0;}
.primary{background:var(--pink-dark);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;}
.secondary{background:var(--border);color:var(--text);border:none;padding:12px;border-radius:10px;font-weight:600;cursor:pointer;}
.close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden;}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);}
th{background:#ffe3ec;color:var(--pink-dark);text-transform:uppercase;font-size:11px;letter-spacing:.4px;}
.smallbtn{padding:5px 9px;border-radius:6px;border:none;font-size:12px;cursor:pointer;margin-right:4px;}
.edit{background:var(--accent);color:#083b2c;}
.del{background:#d9534f;color:#fff;}
.overflow-x{overflow-x:auto;}
.statgrid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.stat{flex:1 1 120px;min-width:min-content;max-width:100%;position:relative;overflow:hidden;isolation:isolate;background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;}
/* সংখ্যা বড় হলে ঘরও সাথে বড় হয় (সংখ্যা ভাঙে না) */
.statnum{font-size:24px;font-weight:800;color:var(--pink-dark);white-space:nowrap;position:relative;transition:color .45s ease .12s;}
.statlabel{font-size:12px;color:var(--muted);position:relative;transition:color .45s ease .12s;}
/* মাউস রাখলে ঢেউয়ের মতো কালার উঠে আসে, সরালে নেমে যায় */
.stat::before,.stat::after{content:"";position:absolute;left:50%;top:180%;width:230%;aspect-ratio:1;margin-left:-115%;z-index:-1;pointer-events:none;transition:top 1.1s cubic-bezier(.45,.05,.35,1);animation:statwave 5s linear infinite paused;}
.stat::before{border-radius:42%;background:rgba(255,143,171,.55);}
.stat::after{border-radius:38%;background:linear-gradient(160deg,var(--pink),var(--pink-dark));animation-duration:7s;animation-direction:reverse;transition-duration:1.4s;}
@keyframes statwave{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@media (hover:hover){
  .stat:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(232,93,138,.28);border-color:var(--pink);}
  .stat:hover::before,.stat:hover::after{top:-95%;animation-play-state:running;}
  .stat:hover .statnum,.stat:hover .statlabel{color:#fff;}
}
.stat:active::before,.stat:active::after{top:-95%;animation-play-state:running;}
.stat:active .statnum,.stat:active .statlabel{color:#fff;}
@media (prefers-reduced-motion:reduce){ .stat::before,.stat::after{animation:none;} }
@media (max-width:420px){ .statnum{font-size:clamp(18px,6vw,24px);} }
.ordercard{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer;}
.ordercard small{color:var(--muted);}
.subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.subtabs button{background:var(--card);border:1px solid var(--border);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;}
.subtabs button.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.note{font-size:12px;color:var(--muted);margin-top:10px;}
.features-list{margin:8px 0;padding-left:18px;font-size:13px;}
.features-list li{margin-bottom:3px;}
table.wide{min-width:680px;}
@media (max-width:700px){
  main{padding:12px 12px 90px;}
  header{padding:8px 12px;}
  header h1{font-size:16px;}
  .navicons{gap:12px;}
}
@media (max-width:380px){
  .navicon small{display:none;}
  .navicons{gap:10px;}
}
</style>
</head>

<header>
  <h1>🛠 Baby Poshak Admin</h1>
  <div class="navicons">
    <div class="navicon hidden" id="notifBell" onclick="showPendingOrdersSheet()"><span class="ic">🔔</span><small>Orders</small><span class="navbadge hidden" id="notifBadge">0</span></div>
    <a href="index.html" class="navicon" style="text-decoration:none"><span class="ic">🛍</span><small>দোকান দেখুন</small></a>
    <div class="navicon hidden" id="logoutBtn" onclick="auth.signOut()"><span class="ic">🚪</span><small>লগআউট</small></div>
  </div>
</header>
<div class="hidden" id="newOrderBanner" style="background:#2bb673;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="this.classList.add('hidden');adminTab='orders';renderAdmin();">
  <span></span><span>✕</span>
</div>
<main>
  <div id="adminView"></div>
</main>

window.addEventListener('unhandledrejection', e=>{
  const m = (e.reason && e.reason.message) ? e.reason.message : String(e.reason||'');
  e.preventDefault();
  if(Date.now() - _lastErrAlert < 1500) return;
  _lastErrAlert = Date.now();
  if(/permission|insufficient/i.test(m)) alert('❌ সেভ/আপডেট হয়নি — অনুমতি নেই।\nFirestore Rules Publish করেছেন কি? সঠিক Admin ইমেইলে লগইন আছে কি?');

  else alert('❌ কাজটি সম্পন্ন হয়নি: ' + m);
});

auth.onAuthStateChanged(u=>{
  isAdmin = !!u;
  if(!u){ const eb = document.getElementById('dataErrorBanner'); if(eb) eb.remove(); }
  if(u && !unsubOrders){
    if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); }
    firstOrderLoad = true;
    unsubOrders = db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap=>{
      if(!firstOrderLoad){
        snap.docChanges().forEach(ch=>{
          if(ch.type==='added') notifyNewOrder({id:ch.doc.id, ...ch.doc.data()});
          if(ch.type==='modified'){
            const nd = {id:ch.doc.id, ...ch.doc.data()};
            const old = orders.find(x=>x.id===nd.id);
            if(nd.customerConfirmed && old && !old.customerConfirmed) notifyReceived(nd);
          }
        });
      }
      firstOrderLoad = false;
      orders = snap.docs.map(d=>({id:d.id, ...d.data()}));
      updateNotifBadge();
      if(isAdmin && (adminTab==='orders'||adminTab==='analytics')) renderAdminBody();
      if(isAdmin && adminTab==='memo' && memoSubTab==='online') fillMemoList();
    }, err=>showDataError('অর্ডার', err));
  }
  if(!u && unsubOrders){ unsubOrders(); unsubOrders = null; orders = []; updateNotifBadge(); }
  if(u && !unsubMemos){
    unsubMemos = db.collection('memos').orderBy('createdAt','desc').onSnapshot(snap=>{
      memos = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(isAdmin && adminTab==='memo') renderMemoTab(document.getElementById('adminBody'));
    }, err=>showDataError('মেমো', err));
  }
  if(!u && unsubMemos){ unsubMemos(); unsubMemos = null; memos = []; }
  if(u && !unsubOffers){
    unsubOffers = db.collection('offers').orderBy('createdAt','desc').onSnapshot(snap=>{
      offers = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(isAdmin && adminTab==='offers') renderAdminBody();
    }, err=>showDataError('অফার', err));
  }
  if(!u && unsubOffers){ unsubOffers(); unsubOffers = null; offers = []; }
  if(u && !unsubBanners){
    unsubBanners = db.collection('banners').onSnapshot(snap=>{
      banners = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(isAdmin && adminTab==='banners') renderAdminBody();
    }, err=>showDataError('ব্যানার', err));
  }
  if(!u && unsubBanners){ unsubBanners(); unsubBanners = null; banners = []; }
  if(u && !unsubTicker){
    unsubTicker = db.collection('ticker').onSnapshot(snap=>{
      ticker = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(isAdmin && adminTab==='ticker') renderAdminBody();
    }, err=>showDataError('নোটিশ বার', err));
  }
  if(!u && unsubTicker){ unsubTicker(); unsubTicker = null; ticker = []; }
  renderAdmin();
});

function startOfToday(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function orderMs(o){ return o.createdAt && o.createdAt.toMillis ? o.createdAt.toMillis() : 0; }
function isToday(ms){ return ms >= startOfToday(); }
function deliveredToday(o){ return (o.history||[]).some(h=>h.status==='Delivered' && h.at>=startOfToday()); }
function renderReportsTab(body){

    const todaysDeliveryQty = todaysDeliveredOrders.reduce((s,o)=>s+(o.items||[]).reduce((a,i)=>a+(Number(i.qty)||0),0),0);
    const stockValue = products.reduce((s,p)=>s+(Number(p.stock)||0)*(Number(p.purchasePrice)||0),0);
    const salesByProduct={};
    validOrders.forEach(o=>(o.items||[]).forEach(i=>{ salesByProduct[i.name]=(salesByProduct[i.name]||0)+(Number(i.qty)||0); }));
    const top = Object.entries(salesByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);
    body.innerHTML = `<div class="statgrid">

let profitRange = 'today';
function setProfitRange(r){ profitRange=r; document.querySelectorAll('#profitTabs button').forEach((b,i)=>b.classList.toggle('active', ['today','weekly','monthly','yearly'][i]===r)); renderProfitBox(); }
function productCost(id){ const p = products.find(x=>x.id===id); return p ? (Number(p.purchasePrice)||0) : 0; }
function orderProfit(o){ return (o.items||[]).reduce((s,i)=>s+((Number(i.price)||0)-productCost(i.id))*(Number(i.qty)||0), 0); }
function rangeStartMs(r){
  const d = new Date(); d.setHours(0,0,0,0);
  if(r==='today') return d.getTime();
  if(r==='weekly'){ d.setDate(d.getDate()-6); return d.getTime(); }
  if(r==='monthly'){ d.setDate(d.getDate()-29); return d.getTime(); }
  if(r==='yearly'){ d.setFullYear(d.getFullYear()-1); return d.getTime(); }
  return d.getTime();
}
function renderProfitBox(){
  const box = document.getElementById('profitBox'); if(!box) return;
  const valid = orders.filter(o=>o.status!=='Cancelled');
  const start = rangeStartMs(profitRange);
  const inRange = valid.filter(o=>orderMs(o)>=start);
  const totalProfit = inRange.reduce((s,o)=>s+orderProfit(o), 0);
  const byDate = {};
  inRange.forEach(o=>{ const key = o.createdAt&&o.createdAt.toDate ? o.createdAt.toDate().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : 'অজানা'; byDate[key]=(byDate[key]||0)+orderProfit(o); });
  const dateRows = Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0]));
  box.innerHTML = `<div class="statgrid" style="width:fit-content;min-width:200px;max-width:100%;margin-bottom:12px">
      <div class="stat"><div class="statnum">৳${totalProfit.toFixed(2)}</div><div class="statlabel">${{today:'Today',weekly:'Weekly',monthly:'Monthly',yearly:'Yearly'}[profitRange]} Profit</div></div>
    </div>
    ${profitRange==='today' ? '' : `<div class="overflow-x"><table><tr><th>তারিখ</th><th>প্রফিট</th></tr>
      ${dateRows.map(([d,v])=>`<tr><td>${d}</td><td>৳${v.toFixed(2)}</td></tr>`).join('') || '<tr><td colspan="2">কোনো ডেটা নেই</td></tr>'}
    </table></div>`}
    <p class="note">প্রফিট হিসাব হয় বর্তমান Purchase Price দিয়ে, তাই প্রোডাক্টের কেনা দাম পরে বদলালে পুরনো অর্ডারের প্রফিটও নতুন দামে হিসাব হবে।</p>`;
}

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){
  if(!ts || !ts.toDate) return '';
  return ts.toDate().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function intlPhone(p){
  const d = String(p||'').replace(/\D/g,'');
  if(d.startsWith('880')) return d;
  if(d.startsWith('0')) return '88'+d;
  return '88'+d;
}
function statusPatch(o, status){
  if(o.status===status) return {};
  return { status, history: firebase.firestore.FieldValue.arrayUnion({status, at: Date.now()}) };
}
function orderFlags(o){
  const f = [], items = o.items || [];
  const sub = items.reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||0),0);
  const calc = sub + (Number(o.deliveryCharge)||0);
  if(Math.abs(calc - (Number(o.total)||0)) > 0.5) f.push({high:true, t:`মোট টাকা মেলেনি — অর্ডারে মোট ৳${Number(o.total)||0}, কিন্তু আইটেম + ডেলিভারি চার্জ = ৳${calc}`});
  items.forEach(i=>{
    const p = products.find(x=>x.id===i.id);
    if(!(Number(i.price)>0) || !(Number(i.qty)>0)) f.push({high:true, t:`${i.name||i.id}: দাম বা পরিমাণ সঠিক নয়`});
    else if(p && Number(i.price) < Number(p.price)) f.push({high:false, t:`${i.name||i.id}: অর্ডারে দাম ৳${i.price}, বর্তমান দাম ৳${p.price} (অফার/ছাড় না থাকলে যাচাই করুন)`});
  });
  if(o.trxId){
    const dup = orders.filter(x=>x.id!==o.id && x.trxId===o.trxId);
    if(dup.length) f.push({high:true, t:`এই Transaction ID আরও ${dup.length}টি অর্ডারে দেওয়া হয়েছে (${dup.map(x=>x.id).join(', ')}) — কনফার্ম করার আগে যাচাই করুন`});
  }
  return f;
}
function orderFlagsHtml(o){ return orderFlags(o).map(x=>`<br><b style="color:${x.high?'#c92a2a':'#b45309'}">⚠️ ${esc(x.t)}</b>`).join(''); }
async function restockOrder(o){
  if(!confirm('অর্ডারটি বাতিল করা হলো। প্রোডাক্টের স্টক ফেরত যোগ করবেন?')) return;
  const failed = [];
  for(const it of (o.items||[])){
    try{ await db.collection('products').doc(it.id).update({ stock: firebase.firestore.FieldValue.increment(Number(it.qty)||0), sold: firebase.firestore.FieldValue.increment(-(Number(it.qty)||0)) }); }
    catch(e){ console.warn(e); failed.push(it.name||it.id); }
  }
  if(failed.length) alert('❌ এই প্রোডাক্টগুলোর স্টক ফেরত যোগ হয়নি (প্রোডাক্ট ডিলিট হয়ে থাকতে পারে): ' + failed.join(', '));
  // স্টক ফেরত দেওয়া হয়েছে — পরে অর্ডার আবার চালু করলে এটা দেখে আবার স্টক কমানো হবে
  try{ await db.collection('orders').doc(o.id).update({ stockRestored: failed.length===0 }); }catch(e){ console.warn(e); }
}
async function destockOrder(o){
  if(!o.stockRestored) return; // আগে স্টক ফেরত না দিলে আবার কমানোর দরকার নেই
  const short = (o.items||[]).filter(it=>{ const p = products.find(x=>x.id===it.id); return !p || (Number(p.stock)||0) < (Number(it.qty)||0); });
  const msg = 'অর্ডারটি আবার চালু করা হলো। প্রোডাক্টের স্টক আবার কমাবেন?' + (short.length ? '\n\n⚠️ স্টক কম আছে: ' + short.map(i=>i.name||i.id).join(', ') : '');
  if(!confirm(msg)) return;
  const failed = [];
  for(const it of (o.items||[])){
    try{ await db.collection('products').doc(it.id).update({ stock: firebase.firestore.FieldValue.increment(-(Number(it.qty)||0)), sold: firebase.firestore.FieldValue.increment(Number(it.qty)||0) }); }
    catch(e){ console.warn(e); failed.push(it.name||it.id); }
  }
  if(failed.length) alert('❌ এই প্রোডাক্টগুলোর স্টক কমানো যায়নি: ' + failed.join(', '));
  try{ await db.collection('orders').doc(o.id).update({ stockRestored: false }); }catch(e){ console.warn(e); }
}
async function updateStatus(id, status){
  const o = orders.find(x=>x.id===id); if(!o) return;
  const patch = statusPatch(o, status);
  if(!Object.keys(patch).length) return;
  await db.collection('orders').doc(id).update(patch);
  if(status==='Cancelled') await restockOrder(o);
  else if(o.status==='Cancelled') await destockOrder(o);
}

async function saveOrder(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  const status = document.getElementById('oStatus').value;
  const trackingUrl = document.getElementById('oTrackUrl').value.trim();
  if(trackingUrl && !/^https?:\/\//i.test(trackingUrl)){ alert('ট্র্যাকিং লিংক http:// বা https:// দিয়ে শুরু হতে হবে'); return; }
  const patch = Object.assign(statusPatch(o,status), {
    courier: document.getElementById('oCourier').value,
    trackingId: document.getElementById('oTrackId').value.trim(),
    trackingUrl,
    trackingNote: document.getElementById('oNote').value.trim(),
    estDelivery: document.getElementById('oEta').value
  });
  await db.collection('orders').doc(id).update(patch);
  if(status==='Cancelled' && o.status!=='Cancelled') await restockOrder(o);
  else if(o.status==='Cancelled' && status!=='Cancelled') await destockOrder(o);
  closeSheet();
}

function addMemoItem(){

  const id = sel.value; if(!id) return;
  const p = products.find(x=>x.id===id); if(!p) return;
  const existing = memoDraftItems.find(i=>i.id===id);

  else memoDraftItems.push({id, name:p.name, price:Number(p.price)||0, qty:1, size:p.size||'', color:p.color||''});

async function saveMemo(status){
  if(!memoDraftItems.length){ alert('কমপক্ষে একটা প্রোডাক্ট যোগ করুন'); return; }
  const subtotal = memoDraftItems.reduce((s,i)=>s+i.price*i.qty,0);
  const discount = parseFloat(document.getElementById('memoDiscount').value)||0;
  const deliveryCharge = parseFloat(document.getElementById('memoDelivery').value)||0;
  const total = subtotal - discount + deliveryCharge;
  const data = {
    memoNo: genMemoNo(),
    items: memoDraftItems,
    subtotal, discount, deliveryCharge, total,
    customerName: document.getElementById('memoCustName').value.trim(),
    customerPhone: document.getElementById('memoCustPhone').value.trim(),
    customerAddr: document.getElementById('memoCustAddr').value.trim(),
    pay: document.getElementById('memoPay').value,
    courier: document.getElementById('memoCourier').value,
    trackingId: document.getElementById('memoTrackId').value.trim(),
    status,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if(status==='final'){
    for(const it of memoDraftItems){
      try{ await db.collection('products').doc(it.id).update({ stock: firebase.firestore.FieldValue.increment(-it.qty), sold: firebase.firestore.FieldValue.increment(it.qty) }); }catch(e){ console.warn(e); }
    }
  }
  await db.collection('memos').add(data);
  memoDraftItems = [];
  alert(status==='final' ? 'Memo ফাইনাল হয়েছে ও স্টক আপডেট হয়েছে' : 'Draft হিসেবে সেভ হয়েছে');
  setMemoSubTab(status==='final' ? 'history' : 'drafts');
}

async function moveBanner(id, dir){
  const list = sortedBanners();
  const i = list.findIndex(b=>b.id===id), j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  for(let k=0; k<list.length; k++){
    if(list[k].order !== k+1) await db.collection('banners').doc(list[k].id).update({ order:k+1 });
  }
}
async function deleteBanner(id){
  if(!confirm('এই ব্যানারটি ডিলিট করবেন?')) return;

}

function refreshVisits(){ visitsLoaded = false; renderAdminBody(); }
function vMs(x){ return x.at && x.at.toMillis ? x.at.toMillis() : 0; }
function fmtDT(ms){ return ms && isFinite(ms) ? new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '-'; }
function renderVisitorsTab(body){
  if(!visitsLoaded){ body.innerHTML = '<p class="note">ভিজিটর ডেটা লোড হচ্ছে...</p>'; loadVisits(); return; }
  const pure = visits.filter(x=>x.type!=='order');
  const today0 = startOfToday(), DAY = 86400000;
  const uniq = arr => new Set(arr.map(x=>x.vid)).size;
  const todayV = pure.filter(x=>vMs(x)>=today0);
  const weekV = pure.filter(x=>vMs(x)>=today0-6*DAY);

  const people = {};
  visits.forEach(x=>{
    const p = people[x.vid] || (people[x.vid] = {vid:x.vid, count:0, first:Infinity, last:0, device:x.device||'', ref:'', name:'', phone:''});
    if(x.type==='order'){ p.name = p.name || x.name || ''; p.phone = p.phone || x.phone || ''; return; }
    p.count++;
    const t = vMs(x);
    if(t && t<p.first){ p.first = t; p.ref = x.ref || p.ref; }
    if(t>p.last){ p.last = t; p.device = x.device || p.device; }
  });
  const peopleList = Object.values(people).filter(p=>p.count>0).sort((a,b)=>b.last-a.last).slice(0,100);

  const refs = {};
  pure.forEach(x=>{ const r = x.ref || 'Direct'; const o = refs[r] || (refs[r] = {n:0, ids:new Set()}); o.n++; o.ids.add(x.vid); });
  const refRows = Object.entries(refs).sort((a,b)=>b[1].n-a[1].n);

  const dayRows = [];
  for(let i=0;i<14;i++){
    const s = today0 - i*DAY;
    const dv = pure.filter(x=>vMs(x)>=s && vMs(x)<s+DAY);
    dayRows.push(`<tr><td>${new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</td><td>${dv.length}</td><td>${uniq(dv)}</td></tr>`);
  }

  body.innerHTML = `
    <p class="note" style="margin:0 0 10px">কাস্টমারদের লগইন লাগে না, তাই এখানে সাইটে কে কতবার ঢুকেছে (ভিজিট) দেখানো হচ্ছে। একই ফোন/ব্রাউজার = একজন ভিজিটর। কেউ অর্ডার করলে তার নাম ও নম্বর এখানে দেখা যাবে।</p>
    <div class="statgrid">
      <div class="stat"><div class="statnum">${pure.length}</div><div class="statlabel">মোট ভিজিট</div></div>
      <div class="stat"><div class="statnum">${uniq(pure)}</div><div class="statlabel">আলাদা ভিজিটর</div></div>
      <div class="stat"><div class="statnum">${todayV.length}</div><div class="statlabel">আজকের ভিজিট</div></div>
      <div class="stat"><div class="statnum">${uniq(todayV)}</div><div class="statlabel">আজকের ভিজিটর</div></div>
      <div class="stat"><div class="statnum">${weekV.length}</div><div class="statlabel">শেষ ৭ দিনের ভিজিট</div></div>
    </div>
    <button class="secondary" style="margin-bottom:14px" onclick="refreshVisits()">🔄 রিফ্রেশ</button>
    ${visits.length>=1000 ? '<p class="note">সর্বশেষ ১০০০টি রেকর্ড দেখানো হচ্ছে।</p>' : ''}

    <h3>🔗 কাকে লিংক দিলেন? আলাদা লিংক বানান</h3>
    <p class="note" style="margin:0 0 8px">প্রতিজনের নামে একটা করে লিংক বানিয়ে তাকে দিন। তাহলে নিচের "উৎস" তালিকায় দেখা যাবে কোন লিংক থেকে কতজন কতবার ঢুকেছে।</p>
    <input id="trkName" placeholder="যার জন্য লিংক, যেমন: Rahim">
    <button class="primary" style="margin-bottom:10px" onclick="makeTrackLink()">লিংক বানান</button>
    <div id="trkLinkOut"></div>

    <h3>উৎস অনুযায়ী (কোন লিংক/জায়গা থেকে এসেছে)</h3>
    <div class="overflow-x"><table><tr><th>উৎস</th><th>ভিজিট</th><th>আলাদা ভিজিটর</th></tr>

    </table></div>

    <h3 style="margin-top:18px">ভিজিটর তালিকা (সর্বশেষ ১০০ জন)</h3>
    <div class="overflow-x"><table class="wide"><tr><th>ভিজিটর</th><th>উৎস</th><th>ডিভাইস</th><th>ভিজিট</th><th>প্রথম</th><th>শেষ</th></tr>

        <td>${esc(p.ref||'-')}</td><td>${esc(p.device||'-')}</td><td><b>${p.count}</b></td>
        <td><small>${fmtDT(p.first)}</small></td><td><small>${fmtDT(p.last)}</small></td></tr>`).join('') || '<tr><td colspan="6">এখনো কোনো ভিজিটর নেই</td></tr>'}
    </table></div>

    <h3 style="margin-top:18px">দিন অনুযায়ী (শেষ ১৪ দিন)</h3>
    <div class="overflow-x"><table><tr><th>তারিখ</th><th>ভিজিট</th><th>আলাদা ভিজিটর</th></tr>${dayRows.join('')}</table></div>
    <p class="note">যে ডিভাইসে আপনি Admin পেজ খুলেছেন সেই ডিভাইসের ভিজিট গোনা হয় না, যাতে আপনার নিজের ঢোকা হিসাবে না আসে।</p>`;
}

function toLocalInput(ms){

}
function fmtOfferDT(ms){

function setOfferEnd(v){

const BACKUP_COLS = [['products','প্রোডাক্ট'],['orders','অর্ডার'],['memos','মেমো'],['offers','অফার'],['banners','ব্যানার'],['ticker','নোটিশ বার'],['visits','ভিজিটর']];
const RESTORABLE = ['products','memos','offers','banners','ticker']; // Rules অনুযায়ী অর্ডার/ভিজিট ফেরত লেখা যায় না
function backupLast(){ try{ return Number(localStorage.getItem('bp_last_backup'))||0; }catch(e){ return 0; } }
function backupOverdue(){ const t = backupLast(); return !t || (Date.now()-t) > 7*86400000; }
function bkSer(v){
  if(v && typeof v.toMillis === 'function') return {__ts: v.toMillis()};
  if(Array.isArray(v)) return v.map(bkSer);
  if(v && typeof v === 'object'){ const o = {}; Object.keys(v).forEach(k=>{ o[k] = bkSer(v[k]); }); return o; }
  return v;
}
function bkDeser(v){
  if(Array.isArray(v)) return v.map(bkDeser);
  if(v && typeof v === 'object'){
    const ks = Object.keys(v);
    if(ks.length === 1 && ks[0] === '__ts' && typeof v.__ts === 'number') return firebase.firestore.Timestamp.fromMillis(v.__ts);
    const o = {}; ks.forEach(k=>{ o[k] = bkDeser(v[k]); }); return o;
  }
  return v;
}
function bkStamp(){ const d = new Date(), p = n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); }
function bkDownload(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = name;
  document.body.appendChild(l); l.click();
  setTimeout(()=>{ URL.revokeObjectURL(l.href); l.remove(); }, 1500);
}
function bkLastText(){
  const t = backupLast();
  if(!t) return '<b style="color:#c92a2a">⚠️ এখনো কোনো ব্যাকআপ নেওয়া হয়নি</b>';
  const days = Math.floor((Date.now()-t)/86400000);
  const when = new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
  return `<b style="color:${days>7?'#c92a2a':'#0e9f6e'}">শেষ ব্যাকআপ: ${esc(when)} (${days===0?'আজ':days+' দিন আগে'})${days>7?' — আবার নিন ⚠️':''}</b>`;
}

async function backupAll(){
  const st = document.getElementById('bkStatus');
  const withVisits = document.getElementById('bkVisits').checked;
  const cols = BACKUP_COLS.filter(c=>withVisits || c[0] !== 'visits');
  const out = {app:'Baby Poshak', version:1, exportedAt:new Date().toISOString(), exportedBy:(auth.currentUser && auth.currentUser.email) || '', counts:{}, data:{}};
  for(const [name,label] of cols){
    st.textContent = '⏳ ' + label + ' নেওয়া হচ্ছে...';
    const snap = await db.collection(name).get();
    out.data[name] = snap.docs.map(d=>({id:d.id, data:bkSer(d.data())}));
    out.counts[name] = out.data[name].length;
  }
  bkDownload('baby-poshak-backup-' + bkStamp() + '.json', JSON.stringify(out, null, 1), 'application/json');
  try{ localStorage.setItem('bp_last_backup', String(Date.now())); }catch(e){}
  st.innerHTML = '✅ ব্যাকআপ ডাউনলোড হয়েছে: ' + cols.map(c=>esc(c[1]) + ' ' + out.counts[c[0]] + 'টি').join(' · ');
  const ll = document.getElementById('bkLast'); if(ll) ll.innerHTML = bkLastText();
}
function csvCell(v){ const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function csvText(rows){ return '\uFEFF' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); }
function bkDate(ts){ const ms = ts && ts.toMillis ? ts.toMillis() : 0; return ms ? new Date(ms).toLocaleString('en-GB') : ''; }
async function backupCsv(kind){
  const st = document.getElementById('bkStatus');
  st.textContent = '⏳ ডেটা নেওয়া হচ্ছে...';
  const snap = await db.collection(kind).get();
  const docs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  let rows;
  if(kind === 'orders'){
    rows = [['Order ID','Date','Name','Phone','Address','Payment','Transaction ID','Items','Delivery Area','Delivery Charge','Total','Status','Courier','Tracking ID','Customer Confirmed']];
    docs.sort((a,b)=>(b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0)).forEach(o=>{
      rows.push([o.id, bkDate(o.createdAt), o.name, o.phone, o.addr, o.pay, o.trxId||'', (o.items||[]).map(i=>i.name+' x'+i.qty+' @'+i.price).join(' | '), o.deliveryArea, o.deliveryCharge, o.total, o.status, o.courier||'', o.trackingId||'', o.customerConfirmed?'Yes':'']);
    });
  } else {
    rows = [['ID','Name','Category','Sub-category','Age','Size','Color','Price','Purchase Price','Original Price','Stock','Sold','Image URL','Features']];
    docs.forEach(p=>{ rows.push([p.id, p.name, p.category||'', p.subcategory||'', p.ageGroup||'', p.size||'', p.color||'', p.price, p.purchasePrice||0, p.originalPrice||0, p.stock, p.sold||0, p.imageUrl||'', (p.features||'').replace(/\n/g,' / ')]); });
  }
  bkDownload('baby-poshak-' + kind + '-' + bkStamp() + '.csv', csvText(rows), 'text/csv;charset=utf-8');
  st.innerHTML = '✅ ' + (kind==='orders'?'অর্ডার':'প্রোডাক্ট') + ' ' + docs.length + 'টি CSV ফাইলে ডাউনলোড হয়েছে (Excel এ খুলবে)';
}
async function restoreBackup(){
  const f = document.getElementById('bkFile').files[0];
  if(!f){ alert('আগে ব্যাকআপ ফাইল (.json) বেছে নিন'); return; }
  let j;
  try{ j = JSON.parse(await f.text()); }catch(e){ alert('ফাইলটি পড়া যায়নি — সঠিক Baby Poshak ব্যাকআপ (.json) দিন'); return; }
  if(!j || j.app !== 'Baby Poshak' || !j.data){ alert('এটা Baby Poshak এর ব্যাকআপ ফাইল নয়'); return; }
  const cols = RESTORABLE.filter(c=>Array.isArray(j.data[c]) && j.data[c].length);
  if(!cols.length){ alert('ফাইলে ফিরিয়ে আনার মতো ডেটা নেই'); return; }
  const msg = 'ব্যাকআপের সময়: ' + (j.exportedAt || '?') + '\n\n' + cols.map(c=>c + ': ' + j.data[c].length + 'টি').join('\n') + '\n\nএই ডেটা এখনকার ডেটার ওপর লেখা হবে (একই ID থাকলে ব্যাকআপের মান বসবে, এখনকার বাড়তি ডেটা মুছবে না)। চালিয়ে যাবেন?';
  if(!confirm(msg)) return;
  if(!confirm('শেষবার নিশ্চিত করুন — ফিরিয়ে আনা শুরু হবে।')) return;
  const st = document.getElementById('bkStatus');
  let total = 0;
  for(const c of cols){
    const arr = j.data[c];
    for(let i = 0; i < arr.length; i += 400){
      st.textContent = '⏳ ' + c + ' ফিরিয়ে আনা হচ্ছে... ' + Math.min(i+400, arr.length) + '/' + arr.length;
      const batch = db.batch();
      arr.slice(i, i+400).forEach(x=>{ if(x && x.id && x.data) batch.set(db.collection(c).doc(x.id), bkDeser(x.data)); });
      await batch.commit();
    }
    total += arr.length;
  }
  st.innerHTML = '✅ ' + total + 'টি ডেটা ফিরিয়ে আনা হয়েছে: ' + cols.map(esc).join(', ');
}

renderAdmin();
</script>
<script>
/* অ্যাডমিনের সেভ/ডিলিট/আপডেট ব্যর্থ হলে এখন বার্তা দেখায় (আগে চুপচাপ ব্যর্থ হতো) */
function guard(fn){
  return async function(...args){
    try{ return await fn.apply(this, args); }
    catch(e){
      console.error(e);
      const code = e && e.code ? e.code : '';
      alert('❌ কাজটি সম্পন্ন হয়নি' + (code==='permission-denied'
        ? ' — অনুমতি নেই। Admin ইমেইলে লগইন আছে কি না এবং Firestore Rules Publish করা আছে কি না দেখুন।'
        : (e && e.message ? ': ' + e.message : '')));
    }
  };
}
['updateStatus','saveOrder','saveMemo','finalizeMemo','deleteMemo','saveBanner','saveBulkBanners','moveBanner','deleteBanner','moveTicker','deleteTicker','saveOffer','deleteOffer','saveProduct','deleteProduct','restockOrder','destockOrder','backupAll','backupCsv','restoreBackup']
  .forEach(n=>{ if(typeof window[n] === 'function') window[n] = guard(window[n]); });
</script>
