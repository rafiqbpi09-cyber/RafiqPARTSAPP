<script>
// Inline manifest via Blob so no separate manifest.json file needed
const manifestData = {
  name: "RafiqPARTS",
  short_name: "RafiqPARTS",
  description: "পার্টস মূল্য ও তথ্য ব্যবস্থাপনা",
  start_url: "./",
  scope: "./",
  display: "standalone",
  background_color: "#12233d",
  theme_color: "#12233d",
  orientation: "portrait",
  icons: [
    { src: "icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: "icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
const manifestURL = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestURL;
document.currentScript.parentNode.insertBefore(manifestLink, document.currentScript);

// Inline service worker via Blob
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE='rafiqparts-v2';
    self.addEventListener('install',e=>{ self.skipWaiting(); });
    self.addEventListener('fetch',e=>{ e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))); });
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL, {scope:'./'}).catch(e=>console.log('SW:',e));
}
</script>

<style>
  :root{
    --navy:#12233d;
    --navy-2:#1c3358;
    --steel:#3a5578;
    --paper:#f2f4f7;
    --card:#ffffff;
    --amber:#e2861f;
    --amber-dark:#b96c14;
    --ok:#1f8a4c;
    --danger:#c23b3b;
    --line:#dde3ec;
    --text:#152238;
    --muted:#5c6b82;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hind Siliguri',sans-serif;background:var(--paper);color:var(--text);}
  ::selection{background:var(--amber);color:#fff;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Splash Screen Styling ---------- */
  #splashScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    text-align: center;
    padding: 20px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #splashScreen h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 10px 0;
    letter-spacing: 0.5px;
    animation: splashFadeIn 0.8s ease-out;
  }
  #splashScreen p {
    font-size: 15px;
    color: #a9bcd6;
    margin: 0;
    animation: splashFadeIn 1.2s ease-out;
  }
  @keyframes splashFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Layout shells ---------- */
  #app{min-height:100vh;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}

  .gate{width:100%;max-width:380px;background:var(--card);border-radius:18px;box-shadow:0 20px 50px -20px rgba(18,35,61,.35);overflow:hidden;border:1px solid var(--line);}
  .gate-top{background:linear-gradient(135deg,var(--navy),var(--navy-2));padding:34px 28px 26px;position:relative;}
  .gate-top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:6px;background:linear-gradient(90deg,var(--amber),var(--amber-dark));}
  .gate-top h1{color:#fff;font-size:20px;margin:12px 0 2px;font-weight:700;}
  .gate-top p{color:#a9bcd6;margin:0;font-size:13px;}
  .cog{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .gate-body{padding:26px 28px 30px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.2px;}
  .field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;background:#fbfcfe;transition:.15s;color:var(--text);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--amber);background:#fff;box-shadow:0 0 0 3px rgba(226,134,31,.12);}

  .btn{appearance:none;border:none;cursor:pointer;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:600;font-family:inherit;transition:.15s;}
  .btn-primary{background:var(--amber);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--amber-dark);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-navy:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--steel);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--steel);}
  .btn-danger{background:#fdeceb;color:var(--danger);}
  .btn-danger:hover{background:#f8d7d4;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn-block{width:100%;}
  .link-btn{background:none;border:none;color:var(--steel);font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;}

  .switch-row{display:flex;gap:8px;margin-top:14px;justify-content:center;}
  .err{background:#fdeceb;color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}
  .ok-msg{background:#e9f7ee;color:var(--ok);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}

  /* ---------- Shared top bar ---------- */
  .topbar{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .topbar-brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{width:36px;height:36px;border-radius:9px;object-fit:cover;background:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;}
  .brand-name{font-weight:700;font-size:15.5px;}
  .brand-sub{font-size:11.5px;color:#9db1cd;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .pill{background:rgba(255,255,255,.1);padding:6px 12px;border-radius:20px;font-size:12.5px;}

  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px;}

  /* ---------- Admin nav ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--line);}
  .tab{padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit;}
  .tab.active{background:var(--navy);color:#fff;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;}
  .card + .card{margin-top:16px;}
  .card h3{margin:0 0 14px;font-size:15.5px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}

  /* dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--amber);}
  .stat .num{font-size:28px;font-weight:700;color:var(--navy);}
  .stat .lbl{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .stat .ic{position:absolute;right:16px;top:16px;font-size:22px;opacity:.5;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  th:first-child,td:first-child{text-align:right;}
  tr:hover td{background:#f9fafc;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .badge{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.active{background:#e9f7ee;color:var(--ok);}
  .badge.inactive{background:#fdeceb;color:var(--danger);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input[type=text]{flex:1;min-width:200px;}
  .file-btn{position:relative;overflow:hidden;display:inline-block;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .modal-bg{position:fixed;inset:0;background:rgba(18,35,61,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:24px;max-height:90vh;overflow:auto;}
  .modal h3{margin-top:0;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}

  .empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:13.5px;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}

  /* dealer search page */
  .search-hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:16px;padding:26px 22px;color:#fff;margin-bottom:18px;}
  .search-hero h2{margin:0 0 4px;font-size:17px;}
  .search-hero p{margin:0 0 14px;font-size:12.5px;color:#a9bcd6;}
  .big-search{display:flex;gap:8px;}
  .big-search input{flex:1;padding:13px 16px;border-radius:11px;border:none;font-size:16px;font-family:'JetBrains Mono',monospace;}
  .big-search .btn{padding:13px 20px;}

  .part-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:center;}
  .part-card.exact{background:#fff6ea;border:1.5px solid var(--amber);box-shadow:0 2px 10px -4px rgba(226,134,31,.35);}
  .part-card.exact .pn{color:var(--amber-dark);}
  .part-card .pn{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--navy);font-size:15px;}
  .part-card .nm{font-size:13px;color:var(--muted);margin-top:2px;}
  .part-card .pr{font-weight:700;color:var(--amber-dark);font-size:15px;white-space:nowrap;}
  .group-label{font-size:12px;color:var(--muted);font-weight:600;margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
  .group-label::after{content:"";flex:1;height:1px;background:var(--line);}

  @media(max-width:640px){
    .wrap{padding:16px 12px 50px;}
    th,td{font-size:12.5px;padding:8px 6px;}
  }
</style>
</head>

/* Application Logic */
function renderApp() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-brand">
        <div class="brand-logo">MP</div>
        <div>
          <div class="brand-name">${DB.settings.companyName}</div>
          <div class="brand-sub">Powered by প্রকৌশলী মোঃ রফিকুল ইসলাম</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="pill">সর্বমোট পার্টস: ${DB.parts.length} টি</span>
      </div>
    </div>

    <div class="wrap">
      <div class="search-hero">
        <h2>পার্টস খুঁজুন</h2>
        <p>পার্ট নম্বর, নাম অথবা ক্যাটাগরি লিখে দ্রুত সার্চ করুন</p>
        <div class="big-search">
          <input type="text" id="searchInput" placeholder="Search Part No, Name..." oninput="searchParts()">
        </div>
      </div>

      <div id="resultsList"></div>
    </div>
  `;
  searchParts();
}

function searchParts() {
  const query = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
  const resultsContainer = document.getElementById('resultsList');
  if (!resultsContainer) return;

  const filtered = DB.parts.filter(p => 
    p.partNo.toLowerCase().includes(query) || 
    p.name.toLowerCase().includes(query) || 
    p.category.toLowerCase().includes(query)
  );

  if (filtered.length === 0) {
    resultsContainer.innerHTML = `<div class="empty">কোনো পার্টস পাওয়া যায়নি!</div>`;
    return;
  }

  resultsContainer.innerHTML = filtered.map(p => `
    <div class="part-card ${p.partNo.toLowerCase() === query ? 'exact' : ''}">
      <div>
        <div class="pn">${p.partNo}</div>
        <div class="nm">${p.name} [${p.category}]</div>
      </div>
      <div class="pr">৳ ${p.price.toLocaleString('bn-BD')}</div>
    </div>
  `).join('');
}

// Initializing Application
renderApp();
